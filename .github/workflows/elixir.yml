name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Offline tests: no secrets, so this runs everywhere — including fork PRs.
  # Elixir/OTP entries cover language compat on the main lock; blend entries
  # (see blend.exs) cover dependency-version compat. The
  # old-goth blends automatically skip :integration and :goth_config_swap via
  # test_helper.exs.
  unit:
    name: Unit / offline (OTP ${{ matrix.otp }} | Elixir ${{ matrix.elixir }} | ${{ matrix.blend || 'main lock' }})
    runs-on: ubuntu-latest

    env:
      BLEND: ${{ matrix.blend }}

    strategy:
      # One version's failure shouldn't hide the others' results.
      fail-fast: false
      matrix:
        include:
          # 1.15 is the floor declared in mix.exs; each entry pairs with the
          # newest OTP that Elixir version supports.
          - elixir: '1.15'
            otp: '26'

          - elixir: '1.16'
            otp: '26'

          - elixir: '1.17'
            otp: '27'

          - elixir: '1.18'
            otp: '27'

          - elixir: '1.19'
            otp: '28'

          - elixir: '1.20'
            otp: '29'

          # Blends run on the newest pair — dependency-version compat is
          # their job; language compat is the entries above. Exception: the
          # oldest blend runs on the floor pair, because waffle < 1.1.10
          # trips Elixir 1.20's type-checker warnings (and floor deps on the
          # floor language is the pairing consumers stuck there actually run).
          - { elixir: '1.15', otp: '26', blend: oldest }
          - { elixir: '1.20', otp: '29', blend: goth_1_2 }
    steps:
    - uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      id: beam
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore dependencies cache
      if: ${{ !matrix.blend }}
      uses: actions/cache@v4
      id: mix-cache
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

    # Blend runs fetch into blend/<name>/deps (see blend/premix.exs), so they
    # cache that path keyed on the blend's own lockfile.
    - name: Restore blend dependencies cache
      if: ${{ matrix.blend }}
      uses: actions/cache@v4
      with:
        path: blend/${{ matrix.blend }}/deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-blend-${{ matrix.blend }}-${{ hashFiles(format('blend/{0}/mix.lock', matrix.blend)) }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-blend-${{ matrix.blend }}-

    - name: Install dependencies
      run: mix deps.get --only test

    - name: Compile & lint dependencies
      run: mix compile --warnings-as-errors
      env:
        MIX_ENV: test

    # Formatter output is only stable within an Elixir version, so check it
    # once on the newest main-lock matrix entry rather than on all of them.
    - name: Check Formatting
      if: ${{ matrix.elixir == '1.20' && !matrix.blend }}
      run: mix format --check-formatted

    # MIX_ENV is explicit because `def cli` (which maps test.unit -> :test)
    # only takes effect on Elixir >= 1.15.
    - name: Run offline unit tests
      run: mix test.unit
      env:
        MIX_ENV: test

  # Dependency health, no secrets: the hex.audit / deps.audit checks (see the
  # `audit` alias in mix.exs) and blend lockfile drift (a mix.exs dep change
  # must be followed by `mix blend.get`; regenerated lockfiles get committed).
  audit:
    name: Deps audit & blend drift
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'

    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-29-1.20-mix-dev-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-29-1.20-mix-dev-

    - name: Install dependencies
      run: mix deps.get

    - name: Audit dependencies
      run: mix audit

    - name: Check blend lockfiles are in sync
      run: |
        mix blend.get
        git diff --exit-code blend.exs blend/

  # Full suite against real GCS. Secrets don't exist on fork PRs, so this only
  # runs for pushes, manual dispatches, and PRs from branches in this repo.
  # Version compatibility is the unit matrix's job; this runs one modern pair.
  integration:
    name: Integration / real GCS (OTP ${{ matrix.otp }} | Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      WAFFLE_BUCKET: ${{ secrets.WAFFLE_BUCKET }}
      WAFFLE_BUCKET2: ${{ secrets.WAFFLE_BUCKET2 }}
      # Job-unique object prefix: concurrent workflow runs share the test
      # buckets without touching each other's objects, and the after-suite
      # cleanup only deletes this run's prefix (see test/support/test_run.ex).
      WAFFLE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    strategy:
      matrix:
        include:
          - elixir: '1.20'
            otp: '29'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      id: beam
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore dependencies cache
      uses: actions/cache@v4
      id: mix-cache
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

    - name: Install dependencies
      run: mix deps.get --only test

    # ubuntu-24.04 runner images no longer ship ImageMagick; the transform
    # tests shell out to `convert`.
    - name: Install ImageMagick
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends imagemagick

    - name: Run full suite (integration hits real GCS)
      run: mix test
